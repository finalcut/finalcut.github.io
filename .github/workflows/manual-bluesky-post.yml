name: Manual Bluesky Post

on:
  workflow_dispatch:
    inputs:
      post_file:
        description: 'Blog post filename (e.g., 2025-11-10-my-blog-post.md)'
        required: true
        type: string
      custom_message:
        description: 'Optional custom message (if empty, uses the blog description)'
        required: false
        type: string
      force_repost:
        description: 'Force repost even if blueskyPostURI already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  post-to-bluesky:
    name: Post to Bluesky
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install message preparation dependencies
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Prepare social images
        if: ${{ inputs.force_repost }}
        env:
          POST_FILE: _posts/${{ inputs.post_file }}
        run: |
          python3 .github/scripts/prepare_social_images.py \
            --repository-root . "$POST_FILE"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "$POST_FILE" assets/images/
          if ! git diff --staged --quiet; then
            git commit -m "Prepare social image for Bluesky repost"
            git push
          else
            echo "No social image changes to commit"
          fi

      - name: Prepare message from blog description
        id: prepare
        env:
          POST_FILE: _posts/${{ inputs.post_file }}
          CUSTOM_MESSAGE: ${{ inputs.custom_message }}
        run: |
          python3 .github/scripts/bluesky_post.py

      - name: Setup Ruby before Bluesky post
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 1

      - name: Setup Pages before Bluesky post
        id: pre-post-pages
        uses: actions/configure-pages@v5

      - name: Deploy site before Bluesky post
        run: |
          bundle exec jekyll build --baseurl "${{ steps.pre-post-pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload site before Bluesky post
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-before-bluesky

      - name: Publish site before Bluesky post
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-before-bluesky

      - name: Post to Bluesky
        id: bluesky
        uses: finalcut/bluesky-post-action@feature/add-post-outputs
        env:
          BSKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BSKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        with:
          post: ${{ steps.prepare.outputs.MESSAGE }}
          service: https://bsky.social

      - name: Update post with Bluesky URL
        if: steps.bluesky.outputs.url != ''
        run: |
          POST_PATH="_posts/${{ inputs.post_file }}"
          BLUESKY_URL="${{ steps.bluesky.outputs.url }}"
          REMOVE_FORCE_REPOST="${{ inputs.force_repost }}"

          # Check if post already has blueskyPostURL
          if grep -q "blueskyPostURL:" "$POST_PATH"; then
            echo "Post already has blueskyPostURL. Replacing existing entries."
            # Remove all existing blueskyPostURL lines and add the new one
            awk -v uri="$BLUESKY_URL" -v remove_force_repost="$REMOVE_FORCE_REPOST" '
            BEGIN { in_frontmatter = 0; inserted = 0 }
            /^---$/ {
                if (!in_frontmatter) {
                    in_frontmatter = 1
                    print $0
                } else if (!inserted) {
                    print "blueskyPostURL: " uri
                    print $0
                    inserted = 1
                } else {
                    print $0
                }
                next
            }
            # Skip existing blueskyPostURL lines
            /^blueskyPostURL:/ && in_frontmatter { next }
            /^forceRepost:/ && in_frontmatter && remove_force_repost == "true" { next }
            { print $0 }
            ' "$POST_PATH" > "$POST_PATH.tmp" && mv "$POST_PATH.tmp" "$POST_PATH"
          else
            # Add new blueskyPostURL to frontmatter
            echo "Adding new blueskyPostURL to frontmatter."
            awk -v uri="$BLUESKY_URL" -v remove_force_repost="$REMOVE_FORCE_REPOST" '
            BEGIN { in_frontmatter = 0; inserted = 0 }
            /^---$/ {
                if (!in_frontmatter) {
                    in_frontmatter = 1
                    print $0
                } else if (!inserted) {
                    print "blueskyPostURL: " uri
                    print $0
                    inserted = 1
                } else {
                    print $0
                }
                next
            }
            /^forceRepost:/ && in_frontmatter && remove_force_repost == "true" { next }
            { print $0 }
            ' "$POST_PATH" > "$POST_PATH.tmp" && mv "$POST_PATH.tmp" "$POST_PATH"
          fi

          echo "Updated $POST_PATH with Bluesky URL: $BLUESKY_URL"

          # Commit the change
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "$POST_PATH"
          git commit -m "Add Bluesky post URL to ${{ inputs.post_file }}"
          git push

  rebuild-site:
    name: Rebuild Site After Bluesky Update
    runs-on: ubuntu-latest
    needs: post-to-bluesky
    if: always() && needs.post-to-bluesky.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout updated code
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 1
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-manual
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-manual
